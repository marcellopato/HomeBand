[package]
name = "homeband"
version = "1.0.0"
description = "HomeBand Linux & Web Audio Workstation"
authors = ["marcellopato"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
cpal = "0.15"
hound = "3.5"
